name = "ai-valid"
main = "src/index.js"
compatibility_date = "2024-04-19"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.client.js", "**/*.svg", "**/*.txt", "**/*.json", "**/*.md"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[cache]
enabled = true
